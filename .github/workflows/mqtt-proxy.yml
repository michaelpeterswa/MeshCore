name: mqtt-proxy

on:
  push:
    branches: [feat/nrf52-ethernet-observer]
    tags: ["mqtt-proxy-v*"]
    paths: ["tools/mqtt-proxy/**", ".github/workflows/mqtt-proxy.yml", "src/helpers/MQTTPresets.h"]
  pull_request:
    paths: ["tools/mqtt-proxy/**", ".github/workflows/mqtt-proxy.yml", "src/helpers/MQTTPresets.h"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mqtt-proxy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tools/mqtt-proxy/go.mod
          cache-dependency-path: tools/mqtt-proxy/go.sum
      - run: go vet ./...
      # The presets test reads src/helpers/MQTTPresets.h, so a firmware preset
      # change without the matching proxy change fails here.
      - run: go test -race ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshcore-mqtt-proxy
          tags: |
            type=sha,prefix=,format=short
            type=match,pattern=mqtt-proxy-v(.*),group=1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: tools/mqtt-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
